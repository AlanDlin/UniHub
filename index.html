<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="UniHub">
  <title>UniHub</title>
  <link rel="manifest" href="/manifest.webmanifest?v=5.5.9">
  <link rel="icon" href="/logo.svg?v=5.5.9" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/logo.svg?v=5.5.9">
  <style>
    html,body{margin:0;height:100%;font-family:system-ui,-apple-system,sans-serif;background:#f3f5f8;color:#101828}
    .load,.err{padding:28px;font-weight:650}
    .err b{display:block;margin-bottom:8px}
    .err small{display:block;margin-top:10px;color:#667085;white-space:pre-wrap;word-break:break-word}
  </style>
</head>
<body>
  <div class="load">Cargando UniHub…</div>
  <script>
  (()=>{
    const APP_VERSION='5.5.8';
    const CACHE_NAME='unihub-cloud-v558';
    const CACHE_KEY='/__unihub_cloud_5.5.8.html';
    const CACHE_MAX_AGE_MS=5*60*1000;
    const ENDPOINT=`https://nyodlyoffwqyoequxrdw.supabase.co/rest/v1/app_assets?version=eq.${APP_VERSION}&select=idx,data&order=idx.asc`;
    const API_KEY='sb_publishable_tybczeLoU_O8gNr08NevEw_nsZFUvV2';

    if('serviceWorker' in navigator){
      navigator.serviceWorker.register('/sw.js').catch(()=>{});
    }

    async function readCache(){
      if(!('caches' in window))return null;
      try{
        const cache=await caches.open(CACHE_NAME);
        const response=await cache.match(CACHE_KEY);
        if(!response)return {cache,html:null,cachedAt:0};
        return {
          cache,
          html:await response.text(),
          cachedAt:Number(response.headers.get('X-UniHub-Cached-At')||0)
        };
      }catch(_){
        return null;
      }
    }

    async function downloadApp(){
      if(!('DecompressionStream' in window)){
        throw new Error('Este navegador no soporta el cargador de UniHub.');
      }

      const controller=new AbortController();
      const timeout=setTimeout(()=>controller.abort(),20000);
      let response;
      try{
        response=await fetch(ENDPOINT,{
          cache:'no-store',
          signal:controller.signal,
          headers:{apikey:API_KEY}
        });
      }finally{
        clearTimeout(timeout);
      }

      if(!response.ok)throw new Error('No se pudo descargar UniHub Cloud ('+response.status+').');
      const rows=await response.json();
      if(!rows.length)throw new Error('Paquete de UniHub vacío.');

      const b64=rows.map(x=>x.data).join('');
      const raw=atob(b64);
      const bytes=new Uint8Array(raw.length);
      for(let i=0;i<raw.length;i++)bytes[i]=raw.charCodeAt(i);

      return new Response(
        new Blob([bytes],{type:'application/gzip'}).stream().pipeThrough(new DecompressionStream('gzip'))
      ).text();
    }

    async function saveCache(cache,html){
      if(!cache)return;
      try{
        await cache.put(CACHE_KEY,new Response(html,{
          headers:{
            'Content-Type':'text/html; charset=utf-8',
            'X-UniHub-Cached-At':String(Date.now())
          }
        }));
      }catch(_){}
    }

    function addExerciseShortcut(html){
      const toolbarAnchor="<button class=\"toolBtn\" id=\"pfFolder\">Abrir carpeta</button>";
      const eventAnchor="q('#pfNewFile').onclick=()=>newFile();";
      if(!html.includes(toolbarAnchor)||!html.includes(eventAnchor)){
        console.warn('UniHub: no se encontró el punto de inserción del botón +');
        return html;
      }
      html=html.replace(toolbarAnchor,toolbarAnchor+'<button class="toolBtn" id="pfNextExercise" type="button" title="Crear siguiente ejercicio según el archivo abierto" aria-label="Crear siguiente ejercicio">+</button>');
      html=html.replace(eventAnchor,eventAnchor+"\nq('#pfNextExercise').onclick=()=>{\n  const active=state.active;\n  const match=active&&base(active).match(/^ejercicio\\s*(\\d+)\\.py$/i);\n  if(!match){toast('Abrí un archivo Ejercicio N.py para crear el siguiente.');return;}\n  const folder=dir(active);\n  const used=new Set(Object.keys(state.files).filter(path=>dir(path)===folder).map(path=>{\n    const m=base(path).match(/^ejercicio\\s*(\\d+)\\.py$/i);\n    return m?Number(m[1]):null;\n  }).filter(n=>n!==null));\n  let n=Number(match[1])+1;\n  while(used.has(n))n++;\n  const target=norm((folder?folder+'/':'')+'Ejercicio '+n+'.py');\n  if(target in state.files)return;\n  state.files[target]='';\n  if(!state.open.includes(target))state.open.push(target);\n  state.active=target;\n  if(folder&&!state.expanded.includes(folder))state.expanded.push(folder);\n  save();renderTree();renderTabs();openFile(target);\n};\n");
      return html;
    }

    function addSymbolDock(html){
      const anchor="q('#pfNewFile').onclick=()=>newFile();";
      if(!html.includes(anchor)){
        console.warn('UniHub: no se pudo insertar el menú de símbolos');
        return html;
      }
      html=html.replace(anchor,anchor+"\n(function(){\n  const view=q('#view-pyforge');\n  if(!view||q('#pfSymbolDock'))return;\n  const dock=document.createElement('div');\n  dock.id='pfSymbolDock';\n  dock.className='pfSymbolDock';\n  const toggle=document.createElement('button');\n  toggle.type='button';\n  toggle.className='pfSymbolToggle';\n  toggle.textContent='<>';\n  toggle.title='Símbolos para Python';\n  toggle.setAttribute('aria-label','Abrir símbolos de Python');\n  toggle.setAttribute('aria-expanded','false');\n  const menu=document.createElement('div');\n  menu.className='pfSymbolMenu';\n  menu.hidden=true;\n  const symbols=['>','<','>=','<=','==','!=','=','%','//','**','+','-','*','/',':','(',')','[',']','{','}'];\n  function insertSymbol(symbol){\n    if(!state.active){toast('Abrí un archivo para insertar símbolos.');return;}\n    if(editor?.__native){\n      const ta=window.__pfNative;\n      if(!ta)return;\n      const start=ta.selectionStart,end=ta.selectionEnd;\n      ta.setRangeText(symbol,start,end,'end');\n      ta.dispatchEvent(new Event('input',{bubbles:true}));\n      ta.focus();\n    }else if(editor&&editor.getModel()){\n      const selection=editor.getSelection();\n      if(!selection)return;\n      editor.executeEdits('pf-symbol-menu',[{range:selection,text:symbol,forceMoveMarkers:true}]);\n      editor.focus();\n    }else{\n      toast('El editor todavía no está listo.');\n    }\n  }\n  for(const symbol of symbols){\n    const b=document.createElement('button');\n    b.type='button';\n    b.textContent=symbol;\n    b.title='Insertar '+symbol;\n    b.setAttribute('aria-label','Insertar '+symbol);\n    b.addEventListener('mousedown',e=>e.preventDefault());\n    b.onclick=()=>insertSymbol(symbol);\n    menu.appendChild(b);\n  }\n  toggle.onclick=e=>{\n    e.stopPropagation();\n    menu.hidden=!menu.hidden;\n    toggle.setAttribute('aria-expanded',String(!menu.hidden));\n  };\n  document.addEventListener('pointerdown',e=>{\n    if(!dock.contains(e.target)){menu.hidden=true;toggle.setAttribute('aria-expanded','false');}\n  });\n  dock.append(menu,toggle);\n  view.appendChild(dock);\n})();\n");
      return html.replace('</head>',"<style>\n#view-pyforge .pfSymbolDock{position:fixed;right:12px;top:49%;transform:translateY(-50%);z-index:2100;display:flex;align-items:center;gap:6px}\n#view-pyforge .pfSymbolToggle{width:37px;height:43px;border:1px solid var(--line);border-radius:10px;background:var(--panel2);color:var(--text);font-size:18px;font-weight:700;cursor:pointer;box-shadow:0 5px 16px rgba(0,0,0,.25)}\n#view-pyforge .pfSymbolToggle:hover,#view-pyforge .pfSymbolToggle[aria-expanded=\"true\"]{border-color:var(--accent);background:var(--accent);color:#fff}\n#view-pyforge .pfSymbolMenu{position:absolute;right:45px;top:50%;transform:translateY(-50%);max-height:min(67vh,450px);width:58px;overflow-y:auto;overscroll-behavior:contain;display:flex;flex-direction:column;gap:3px;padding:6px;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 25px rgba(0,0,0,.32)}\n#view-pyforge .pfSymbolMenu[hidden]{display:none}\n#view-pyforge .pfSymbolMenu button{flex:0 0 auto;height:34px;width:100%;padding:0;border:1px solid var(--line);border-radius:6px;color:var(--text);background:var(--panel2);font:600 14px ui-monospace,SFMono-Regular,Menlo,monospace;cursor:pointer}\n#view-pyforge .pfSymbolMenu button:hover{background:var(--accent);color:#fff}\n</style></head>");
    }

    async function boot(){
      try{
        const cached=await readCache();
        const fresh=cached&&cached.html&&(Date.now()-cached.cachedAt)<CACHE_MAX_AGE_MS;
        let html=fresh?cached.html:null;

        if(!html){
          try{
            html=await downloadApp();
            await saveCache(cached&&cached.cache,html);
          }catch(downloadError){
            if(cached&&cached.html)html=cached.html;
            else throw downloadError;
          }
        }

        html=addExerciseShortcut(html);
        html=addSymbolDock(html);
        document.open();
        document.write(html);
        document.close();
      }catch(e){
        console.error(e);
        const msg=String(e&&e.message||e).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
        document.body.innerHTML='<div class="err"><b>No se pudo cargar UniHub.</b><div>Recargá una vez. Si vuelve a pasar, mandame esta línea:</div><small>'+msg+'</small></div>';
      }
    }

    boot();
  })();
  </script>
</body>
</html>
